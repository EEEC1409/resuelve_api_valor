openapi: 3.0.3
info:
  title: API Gateway - Resuelve
  version: "1.0.0"
  description: Punto unico de entrada para tiendas y aliados externos. Emite tokens JWT y enruta solicitudes hacia los BFF.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
  - url: https://api.resuelve.com
    description: Produccion
paths:
  /oauth/token:
    post:
      summary: Emite un token de acceso OAuth2
      operationId: obtenerTokenOAuth
      description: Acepta JSON o application/x-www-form-urlencoded. El client_secret se acepta por compatibilidad, pero la implementacion actual no lo valida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolicitudToken'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaToken'
        '400':
          description: Grant type ausente o no soportado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /v1/evaluaciones-credito:
    post:
      summary: Solicita una evaluacion de credito (enruta a BFF Punto de Venta)
      operationId: crearEvaluacion
      security:
        - OAuth2: [evaluaciones:escribir]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudEvaluacion'
      responses:
        '200':
          description: Decision emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '403':
          description: El token no tiene el scope requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '429':
          description: Limite de tasa excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimiteTasa'
  /v1/evaluaciones-credito/{id}:
    get:
      summary: Consulta el estado de una evaluacion (enruta a BFF Punto de Venta)
      operationId: obtenerEvaluacion
      security:
        - OAuth2: [evaluaciones:leer]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '403':
          description: El token no tiene el scope requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /v1/auditoria/evaluaciones:
    get:
      summary: Lista evaluaciones con filtros (enruta a BFF Auditoria, uso interno)
      operationId: listarAuditoria
      security:
        - OAuth2: [auditoria:leer]
      parameters:
        - name: estado
          in: query
          schema: { type: string, enum: [APROBADO, RECHAZADO, REVISION_MANUAL] }
        - name: fechaDesde
          in: query
          schema: { type: string, format: date }
        - name: fechaHasta
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Pagina de resultados de auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAuditoria'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '403':
          description: El token no tiene el scope requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            evaluaciones:escribir: Crear evaluaciones
            evaluaciones:leer: Consultar evaluaciones
            auditoria:leer: Consultar auditoria interna
  schemas:
    SolicitudToken:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          default: frontend-tiendas
        client_secret:
          type: string
          format: password
          description: Aceptado pero no validado por la implementacion actual.
    RespuestaToken:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string, example: "evaluaciones:escribir evaluaciones:leer auditoria:leer" }
    ErrorApi:
      type: object
      required: [codigo, mensaje, error]
      properties:
        codigo: { type: string, example: TOKEN_INVALIDO }
        mensaje: { type: string, example: "Token OAuth2 invalido o expirado" }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: UNAUTHORIZED }
            message: { type: string, example: "Token OAuth2 invalido o expirado" }
    ErrorLimiteTasa:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: { type: string }
            code: { type: string, example: RATE_LIMIT_EXCEEDED }
    SolicitudEvaluacion:
      type: object
      required: [identificacion, montoSolicitado, plazoMeses, tiendaId]
      properties:
        identificacion: { type: string, example: "0102030405" }
        montoSolicitado: { type: number, format: double, exclusiveMinimum: 0 }
        plazoMeses: { type: integer }
        tiendaId: { type: string, example: "TIENDA-001" }
    Decision:
      type: object
      properties:
        idEvaluacion: { type: string, format: uuid }
        decision: { type: string, enum: [APROBADO, RECHAZADO, REVISION_MANUAL] }
        motivo: { type: string }
        fecha: { type: string, format: date-time }
    PaginaAuditoria:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
